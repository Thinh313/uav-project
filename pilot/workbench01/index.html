<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AERIS · Survey & Inspection Workbench</title><link rel="stylesheet" href="/ui.css"></head><body data-theme="night">
<header><div class="brand"><b>RtR</b><span>AERIS<small>Survey & Inspection</small></span></div><div class="header-status"><i></i><span id="phase-label">Lập nhiệm vụ</span><span class="mock-label">Mô phỏng offline</span></div><div class="header-actions"><button id="workspace" class="icon" aria-label="Workspace và bàn giao" title="Workspace và bàn giao"></button><button id="theme" class="icon" aria-label="Chuyển giao diện sáng" title="Chuyển giao diện sáng"></button></div></header>
<main><div id="map-wrap"><svg id="map" role="img" aria-label="Bản đồ vector tổng hợp và tuyến nhiệm vụ" viewBox="0 0 1100 720"><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="currentColor" stroke-width=".5"/></pattern><radialGradient id="ground"><stop stop-color="#3b5142"/><stop offset="1" stop-color="#15252a"/></radialGradient></defs><rect class="ground" width="1100" height="720" fill="url(#ground)"/><g id="terrain"></g><rect width="1100" height="720" fill="url(#grid)" class="map-grid"/><g id="mission-map"></g></svg><div class="map-caption">Nền vector tổng hợp · WGS84 / ENU · Mặt phẳng giả định, chưa có DEM</div><div class="map-orientation"><span>↑ N</span><span id="scale-label">100 m</span></div></div>
<nav class="rail left-rail glass" aria-label="Giai đoạn nhiệm vụ"><button data-view="plan" aria-label="Lập nhiệm vụ" title="Lập nhiệm vụ"></button><button data-view="preflight" aria-label="Kiểm trước bay" title="Kiểm trước bay"></button><button data-view="fly" aria-label="Fly mô phỏng" title="Fly mô phỏng"></button><button data-view="review" aria-label="Đánh giá kết quả" title="Đánh giá kết quả"></button></nav>
<div class="rail right-rail glass"><button id="fit" aria-label="Vừa vùng khảo sát" title="Vừa vùng khảo sát"></button><button id="zoom-in" aria-label="Phóng to" title="Phóng to"></button><button id="zoom-out" aria-label="Thu nhỏ" title="Thu nhỏ"></button><span class="rail-divider"></span><button id="layers" aria-label="Đổi lớp độ phủ" title="Đổi lớp độ phủ"></button><button id="details" aria-label="Chi tiết nguồn và giới hạn" title="Chi tiết nguồn và giới hạn"></button></div>
<section id="panel" class="panel glass" aria-labelledby="panel-title"><div class="panel-head"><div><small id="panel-step">Nhiệm vụ</small><h1 id="panel-title">Khảo sát khu vực</h1></div><span class="status-dot" id="panel-dot"></span></div><div id="panel-content"></div></section>
<div id="flight-banner" class="glass" hidden><span id="flight-text">Đang diễn tập</span><button id="interrupt">Ngắt link mock</button></div>
<footer class="glass"><div><span>Diện tích mẫu</span><strong id="stat-area">—</strong></div><div><span>GSD dự kiến</span><strong id="stat-gsd">—</strong></div><div><span>Vị trí chụp</span><strong id="stat-shots">—</strong></div><div><span>Độ phủ đạt mẫu</span><strong id="stat-quality">—</strong></div><div><span>Lượt dự kiến</span><strong id="stat-sorties">—</strong></div></footer>
</main><div id="notice" role="status" aria-live="polite"></div><dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="close-modal" class="icon" aria-label="Đóng cửa sổ">×</button></div><div id="modal-body"></div></dialog><script type="module" src="/ui.mjs"></script></body></html>
