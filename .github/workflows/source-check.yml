name: Source and mock checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/handoff/intake.mjs
      - run: python3 -m unittest discover -s tools/handoff/tests -v
      - run: python3 -B -m unittest discover -s handoff/receiver-runtime03/tests -v
