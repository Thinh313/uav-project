name: Source and mock checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/handoff/verify.mjs
      - run: npm run check
      - run: node planning/vidlife12/runtime/tests/mock.mjs
      - run: node planning/vidlife12/runtime/tests/lifecycle-trace.mjs
      - run: node planning/vidlife12/runtime/tests/cold-navigation-r02.mjs
      - run: python3 tools/handoff/mock_wait.py
